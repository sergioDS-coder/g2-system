<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G2 System — Daily Quests</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      color: #00ff41;
      background: #080808;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.08) 3px, rgba(0, 0, 0, 0.08) 4px);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 18px 0 28px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 0.45em;
      color: #00ff41;
      text-shadow: 0 0 18px #00ff41, 0 0 36px rgba(0, 255, 65, 0.4);
    }

    .date-label {
      font-size: 0.72rem;
      color: #009922;
      letter-spacing: 0.25em;
      margin-top: 6px;
    }

    /* ── Quest card ── */
    .quest-card {
      display: flex;
      border: 1px solid rgba(0, 255, 65, 0.7);
      background: rgba(0, 12, 4, 0.75);
      margin-bottom: 20px;
      position: relative;
      box-shadow:
        0 0 18px rgba(0, 255, 65, 0.12),
        inset 0 0 40px rgba(0, 255, 65, 0.03);
    }

    .quest-card.completed {
      border-color: rgba(0, 255, 65, 0.2);
      opacity: 0.55;
    }

    /* ── Left icon panel ── */
    .icon-panel {
      width: 150px;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 14px;
      border-right: 1px solid rgba(0, 255, 65, 0.4);
      gap: 14px;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.8));
    }

    .icon-wrap svg {
      width: 88px;
      height: 88px;
    }

    .exp-label {
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    .exp-label .exp-val {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }

    .exp-label .exp-sub {
      color: #009922;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    .status-done {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: #009922;
      border: 1px solid #009922;
      padding: 3px 8px;
    }

    /* ── Right info panel ── */
    .info-panel {
      flex: 1;
      padding: 16px 18px;
      min-width: 0;
    }

    .quest-title {
      text-align: center;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      color: #00ff41;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
      margin-bottom: 9px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(0, 255, 65, 0.35);
      margin-bottom: 11px;
    }

    /* Stats grid inside bordered box */
    .stats-box {
      border: 1px solid rgba(0, 255, 65, 0.25);
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .stat-row .lbl {
      color: #009922;
    }

    .stat-row .val {
      color: #00ff41;
      font-weight: bold;
    }

    .quest-desc {
      font-size: 0.74rem;
      color: #00bb33;
      line-height: 1.55;
    }

    /* Type badge */
    .type-badge {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      padding: 3px 8px;
    }

    .type-badge.fitness {
      background: #00ff41;
      color: #000;
    }

    .type-badge.mental {
      background: #00ccff;
      color: #000;
    }

    .type-badge.fixed {
      background: #ffaa00;
      color: #000;
    }

    .type-badge.jolly {
      background: #ff44ff;
      color: #000;
    }

    /* Completed tick */
    .done-mark {
      position: absolute;
      top: 7px;
      left: 9px;
      font-size: 1rem;
      color: #00ff41;
      text-shadow: 0 0 8px #00ff41;
    }

    /* Navigation */
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .nav a {
      border: 1px solid rgba(0, 255, 65, 0.5);
      color: #00ff41;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      background: rgba(0, 20, 5, 0.4);
      transition: all 0.2s;
    }

    .nav a:hover {
      background: rgba(0, 255, 65, 0.08);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.25);
    }

    .back-link {
      text-align: center;
      margin-top: 14px;
    }

    .back-link a {
      color: #005518;
      font-size: 0.73rem;
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    .empty-msg {
      text-align: center;
      color: #009922;
      font-size: 0.82rem;
      padding: 50px 20px;
      letter-spacing: 0.1em;
      line-height: 2;
      border: 1px solid rgba(0, 255, 65, 0.15);
    }

    @media (max-width: 460px) {
      .icon-panel {
        width: 110px;
        min-width: 110px;
        padding: 16px 10px;
      }

      .icon-wrap {
        width: 72px;
        height: 72px;
      }

      .icon-wrap svg {
        width: 64px;
        height: 64px;
      }

      .quest-title {
        font-size: 0.72rem;
      }

      .stat-row {
        font-size: 0.72rem;
      }
    }
  </style>
</head>

    const DESCRIPTIONS = {
      corsa:           'Protocollo cardio ad alta intensità. Potenzia la corsa e le performance cardiovascolari. Bonus AGI.',
      flessioni:       'Protocollo forza upper body. Bersaglia pettorali, spalle e tricipiti. Bonus STR.',
      addominali:      'Protocollo core strength. Costruisce resistenza addominale e stabilità. Bonus STR.',
      plank:           'Protocollo endurance statico. Tensione massima sostenuta nel tempo. Bonus END.',
      yoga:            'Protocollo flessibilità e bilanciamento. Ripristina VIT e migliora la consapevolezza corporea.',
      scale:           'Protocollo assalto verticale. Costruisce potenza alle gambe e resistenza. Bonus END.',
      fixed_camminata: 'Baseline movimento giornaliero. 5000 passi minimi per la manutenzione del sistema. Bonus AGI.',
      meditazione:     'Protocollo chiarezza mentale. Riduzione dello stress e potenziamento del focus. Bonus VIT.',
      lettura:         'Protocollo acquisizione conoscenza. Espande l\'attributo INT tramite lettura concentrata.',
      studio:          'Protocollo deep learning. Allenamento cognitivo ad alta intensità. Bonus INT.',
      scrittura:       'Protocollo output creativo. Rafforza i percorsi neurali per la crescita INT.',
      noscreen:        'Protocollo digital detox. Recovery del sistema tramite assenza schermi. Bonus VIT.',
      fixed_sonno:     'Protocollo recovery. Il sonno rigenera tutti gli stat. Essenziale per VIT.',
    }

    const NAMES = {
      corsa:           'CORSA',
      flessioni:       'FLESSIONI',
      addominali:      'ADDOMINALI',
      plank:           'PLANK',
      yoga:            'YOGA',
      scale:           'SALITA SCALE',
      fixed_camminata: 'CAMMINATA',
      meditazione:     'MEDITAZIONE',
      lettura:         'LETTURA',
      studio:          'STUDIO',
      scrittura:       'SCRITTURA',
      noscreen:        'SENZA SCHERMI',
      fixed_sonno:     'SONNO',
    }

    const ATTRS = { str: 'FORZA', agi: 'AGILITÀ', vit: 'VITALITÀ', int: 'INTELLETTO', end: 'RESISTENZA' }
    const TYPE_LABELS = { fitness: 'FITNESS', mental: 'MENTAL', fixed: 'FIXED', jolly: 'JOLLY' }

    function formatTarget(amount, unit) {
      const map = { km: `${amount} km`, reps: `${amount} reps`, min: `${amount} min`, pages: `${amount} pag`, h: `${amount} h`, steps: `${Number(amount).toLocaleString()} steps`, floors: `${amount} piani` }
      return map[unit] || `${amount} ${unit}`
    }

    function buildCard(q) {
      const icon = ICONS[q.templateId] || ICONS['fixed_camminata']
      const name = q.jollyName ? q.jollyName.toUpperCase() : (NAMES[q.templateId] || q.templateId.toUpperCase())
      const desc = DESCRIPTIONS[q.templateId] || 'Completa questa quest per guadagnare EXP e punti attributo.'
      const attr = ATTRS[q.attribute] || q.attribute.toUpperCase()
      const typeLbl = TYPE_LABELS[q.type] || q.type.toUpperCase()
      const target = formatTarget(q.amount, q.unit)

      const statusHtml = q.completed
        ? `<div class="status-done">[COMPLETATA]</div>`
        : `<div class="exp-label"><span class="exp-val">+${q.expReward}</span><span class="exp-sub">EXP REWARD</span></div>`

      return `
        <div class="quest-card ${q.completed ? 'completed' : ''}">
          ${q.completed ? '<div class="done-mark">✓</div>' : ''}
          <span class="type-badge ${q.type}">${typeLbl}</span>
          <div class="icon-panel">
            <div class="icon-wrap">${icon}</div>
            ${statusHtml}
          </div>
          <div class="info-panel">
            <div class="quest-title">[ ${name} ]</div>
            <hr class="divider"/>
            <div class="stats-box">
              <div class="stat-row"><span class="lbl">Attributo</span><span class="val">${attr}</span></div>
              <div class="stat-row"><span class="lbl">Obiettivo</span><span class="val">${target}</span></div>
              <div class="stat-row"><span class="lbl">Ricompensa</span><span class="val">${q.expReward} EXP</span></div>
              <div class="stat-row"><span class="lbl">Stato</span><span class="val">${q.completed ? 'COMPLETATA' : 'IN ATTESA'}</span></div>
            </div>
            <div class="quest-desc">${desc}</div>
          </div>
        </div>`
    }

    function load() {
      const today = new Date().toISOString().split('T')[0]
      document.getElementById('dateLabel').textContent = `— ${today} —`

      const raw = localStorage.getItem('g2sys_quests')
      if (!raw) {
        document.getElementById('questList').innerHTML =
          '<div class="empty-msg">[ NESSUNA QUEST ATTIVA ]<br/>Apri l\'app per generare le quest di oggi.</div>'
        return
      }

      let quests = JSON.parse(raw).filter(q => q.date === today)
      if (!quests.length) {
        document.getElementById('questList').innerHTML =
          '<div class="empty-msg">[ NESSUNA QUEST PER OGGI ]<br/>Apri l\'app per generare le quest giornaliere.</div>'
        return
      }

      quests.sort((a, b) => a.completed - b.completed)
      document.getElementById('questList').innerHTML = quests.map(buildCard).join('')
    }

    load()
  </script>
</body>

</html>
